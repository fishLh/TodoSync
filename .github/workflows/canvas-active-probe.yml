name: Canvas Active Courses Probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Probe
        env:
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
        run: |
          for id in 93965 93753 93145 94319 93878 94098 93915 93954; do
            echo "== course $id assignments =="
            curl -sS -D /tmp/h -o /dev/null --max-time 15 \
              -H "Authorization: Bearer $CANVAS_TOKEN" \
              "https://oc.sjtu.edu.cn/api/v1/courses/$id/assignments?per_page=10&page=1" || echo "page1 curl failed"
            last=$(grep -i '^link:' /tmp/h | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p' | tail -1)
            echo "last=${last:-1}"
            for page in $(seq 1 ${last:-1}); do
              printf "page=%s " "$page"
              curl -sS -o /dev/null -w "http=%{http_code} time=%{time_total}s\n" --max-time 15 \
                -H "Authorization: Bearer $CANVAS_TOKEN" \
                "https://oc.sjtu.edu.cn/api/v1/courses/$id/assignments?per_page=10&page=$page" || echo "curl failed"
            done
          done