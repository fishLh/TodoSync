name: Canvas Active Courses Probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        env:
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
        run: |
          for id in 93965 93753 93145 94319 93878 94098 93915 93954; do
            for ep in assignments quizzes; do
              printf "course=%s ep=%s " "$id" "$ep"
              curl -sS -D /tmp/h -o /dev/null -w "http=%{http_code} time=%{time_total}s\n" --max-time 30 \
                -H "Authorization: Bearer $CANVAS_TOKEN" \
                "https://oc.sjtu.edu.cn/api/v1/courses/$id/$ep?per_page=100&page=1" || echo "curl failed"
              last=$(grep -i '^link:' /tmp/h | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p' | tail -1)
              echo "  last=${last:-1}"
            done
          done