name: Canvas Endpoint Probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe
        env:
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
        run: |
          echo "== profile =="
          curl -sS -o /dev/null -w "http=%{http_code} time=%{time_total}s\n" --max-time 30 \
            -H "Authorization: Bearer $CANVAS_TOKEN" \
            "https://oc.sjtu.edu.cn/api/v1/users/self/profile" || echo "curl failed"

          echo "== courses =="
          curl -sS -o /tmp/courses.json -w "http=%{http_code} time=%{time_total}s\n" --max-time 60 \
            -H "Authorization: Bearer $CANVAS_TOKEN" \
            "https://oc.sjtu.edu.cn/api/v1/courses?per_page=100" || echo "curl failed"
          jq 'length' /tmp/courses.json 2>/dev/null || true

          for id in $(jq -r '.[].id' /tmp/courses.json 2>/dev/null); do
            for ep in quizzes assignments; do
              echo "== course $id $ep =="
              curl -sS -o /dev/null -w "http=%{http_code} time=%{time_total}s\n" --max-time 30 \
                -H "Authorization: Bearer $CANVAS_TOKEN" \
                "https://oc.sjtu.edu.cn/api/v1/courses/$id/$ep?per_page=10&page=1" || echo "curl failed"
            done
          done