name: Canvas Endpoint Probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        env:
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
        run: |
          for path in \
            "courses/8/assignments" \
            "courses/8/quizzes" \
            "courses/7/assignments" \
            "courses/7/quizzes"
          do
            echo "== $path =="
            curl -sS -o /dev/null -w "http=%{http_code} time=%{time_total}s\n" \
              --max-time 200 \
              -H "Authorization: Bearer $CANVAS_TOKEN" \
              "https://oc.sjtu.edu.cn/api/v1/$path?per_page=10&page=1" || echo "curl failed"
          done